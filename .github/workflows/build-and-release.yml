name: Build (Windows, Linux, macOS ARM) and Release Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            installerType: deb
            artifactSuffix: linux
          - os: windows-latest
            installerType: exe
            artifactSuffix: windows
            javaArch: x64
          # Windows ARM: create app-image only (no installer) and zip it
#          - os: windows-2025
#            artifactSuffix: windows-arm
#            javaArch: aarch64
          - os: macos-26
            artifactSuffix: macos-arm64
            releasePlatform: macos
            buildInstaller: true
            installerType: dmg
          - os: ubuntu-latest
            installerType: rpm
            artifactSuffix: linux-rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'
          architecture: ${{ matrix.javaArch || 'x64' }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show Java/Gradle versions
        run: |
          java -version
          ./gradlew --version

      - name: Build
        run: ./gradlew --no-daemon --stacktrace build

      # ---------- Platform-specific signing preparation ----------
      - name: Prepare macOS code signing (keychain)
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          P12_B64: ${{ secrets.MAC_DEV_SIGN_CERT_P12 }}
          P12_PASS: ${{ secrets.MAC_DEV_SIGN_CERT_PASSWORD }}
          MAC_DEV_SIGN_IDENTITY: ${{ secrets.MAC_DEV_SIGN_IDENTITY }}
        run: |
          if [ -z "$P12_B64" ] || [ -z "$P12_PASS" ] || [ -z "$MAC_DEV_SIGN_IDENTITY" ]; then
            echo "::error::MAC_DEV_SIGN_CERT_P12, MAC_DEV_SIGN_CERT_PASSWORD, and MAC_DEV_SIGN_IDENTITY are required for macOS release signing."
            exit 1
          fi
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/cert.p12"
          printf '%s' "$P12_B64" | base64 --decode > "$CERTIFICATE_PATH"
          test -s "$CERTIFICATE_PATH" || {
            echo "::error::MAC_DEV_SIGN_CERT_P12 did not decode to a certificate file."
            exit 1
          }
          openssl pkcs12 -legacy -in "$CERTIFICATE_PATH" -passin env:P12_PASS -noout || {
            echo "::error::MAC_DEV_SIGN_CERT_P12 is not a valid PKCS#12 file, or MAC_DEV_SIGN_CERT_PASSWORD does not match it."
            exit 1
          }
          security create-keychain -p "github-actions" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "github-actions" "$KEYCHAIN"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN" -f pkcs12 -P "$P12_PASS" -A
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "github-actions" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F -- "$MAC_DEV_SIGN_IDENTITY" > /dev/null || {
            echo "::error::The imported keychain does not contain the configured macOS signing identity."
            exit 1
          }
          echo "MAC_SIGN=true" >> "$GITHUB_ENV"
          echo "MAC_DEV_SIGN_IDENTITY=$MAC_DEV_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "MAC_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

#      - name: Prepare Windows code signing (PFX)
#        if: matrix.os == 'windows-latest' && secrets.WIN_CERT_PFX != '' && secrets.WIN_CERT_PASSWORD != '' && secrets.WIN_CERT_ALIAS != ''
#        shell: bash
#        env:
#          PFX_B64: ${{ secrets.WIN_CERT_PFX }}
#          PFX_PASS: ${{ secrets.WIN_CERT_PASSWORD }}
#          PFX_ALIAS: ${{ secrets.WIN_CERT_ALIAS }}
#        run: |
#          set -euo pipefail
#          KS="$RUNNER_TEMP/win-signing.pfx"
#          echo "$PFX_B64" | base64 --decode > "$KS"
#          # Common timestamp server
#          TS_OPTS="/tr http://timestamp.digicert.com /td sha256 /fd sha256"
#          echo "SIGNING_ARGS=-Pwin.sign=true -Pwin.keystore=$KS -Pwin.storepass=$PFX_PASS -Pwin.alias=$PFX_ALIAS -Pwin.signingOptions=$TS_OPTS" >> "$GITHUB_ENV"
#
#      - name: Prepare Linux package signing (GPG for .deb)
#        if: matrix.os == 'ubuntu-latest' && secrets.LINUX_GPG_PRIVATE_KEY != '' && secrets.LINUX_GPG_PASSPHRASE != '' && secrets.LINUX_GPG_KEY_ID != ''
#        shell: bash
#        env:
#          GPG_KEY_B64: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
#          GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
#          GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
#        run: |
#          set -euo pipefail
#          sudo apt-get update
#          sudo apt-get install -y dpkg-sig
#          echo "$GPG_KEY_B64" | base64 --decode > "$RUNNER_TEMP/gpg.key.asc"
#          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import "$RUNNER_TEMP/gpg.key.asc"
#          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
#          echo "GPG_PASSPHRASE=$GPG_PASSPHRASE" >> "$GITHUB_ENV"

      # ---------- Create artifacts ----------
      # Default: Create installer with jpackage (with optional signing args)
      - name: Create installer with jpackage
        if: matrix.artifactSuffix != 'windows-arm'
        shell: bash
        run: |
          set -euo pipefail
          signing_args=()
          if [[ "${MAC_SIGN:-}" == "true" ]]; then
            signing_args=(
              "-Pmac.sign=true"
              "-Pmac.identity=$MAC_DEV_SIGN_IDENTITY"
              "-Pmac.keychain=$MAC_SIGN_KEYCHAIN"
            )
          fi
          ./gradlew --no-daemon --stacktrace jpackage -PinstallerType=${{ matrix.installerType }} "${signing_args[@]}"
          if [ "${{ matrix.os }}" == "macos-14" ]; then
            # Create and sign the native app before it is copied into its DMG.
            ./gradlew --no-daemon --stacktrace createMacApp
            native_app="build/native/bundle/KeystoreManager.app"
            native_executable="$native_app/Contents/MacOS/keystoremanager"
            [ -f "$native_executable" ] || { echo "::error::Missing native executable: $native_executable"; exit 1; }
            codesign --force --options runtime --timestamp --sign "$MAC_DEV_SIGN_IDENTITY" "$native_executable"
            codesign --force --options runtime --timestamp --sign "$MAC_DEV_SIGN_IDENTITY" "$native_app"
            codesign --verify --deep --strict --verbose=2 "$native_app"
            # Preserve the signed app created above; createNativeDmg otherwise
            # reruns createMacApp through its task dependency.
            ./gradlew --no-daemon --stacktrace createNativeDmg -x createMacApp
          fi

      # Windows ARM: Build app-image only (no native installer)
      - name: Create Windows ARM app-image (jpackageImage)
        if: matrix.artifactSuffix == 'windows-arm'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace jpackageImage

      # Windows ARM: Zip the app-image for distribution
      - name: Zip Windows ARM app-image
        if: matrix.artifactSuffix == 'windows-arm'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APP_IMAGE_DIR="build/jpackage/KeystoreManager"
          if [ -d "$APP_IMAGE_DIR" ]; then
            (cd build/jpackage && zip -r ../artifacts/KeystoreManager-windows-arm.zip "$(basename "$APP_IMAGE_DIR")")
          else
            echo "App image was not found at $APP_IMAGE_DIR" >&2
            exit 1
          fi

      - name: Verify macOS jpackage signature
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -euo pipefail
          app="build/jpackage/KeystoreManager.app"
          [ -d "$app" ] || { echo "::error::Missing jpackage app bundle: $app"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -Fq "Authority=$MAC_DEV_SIGN_IDENTITY"

      # ---------- Notarize and staple macOS DMGs ----------
      - name: Notarize and staple macOS DMGs
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -euo pipefail
          for required_secret in APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID APPLE_NOTARY_KEY_P8; do
            [ -n "${!required_secret}" ] || { echo "::error::$required_secret is required for macOS notarization."; exit 1; }
          done
          notary_api_key="$RUNNER_TEMP/apple-notary-key.p8"
          printf '%s' "$APPLE_NOTARY_KEY_P8" | base64 --decode > "$notary_api_key"
          chmod 600 "$notary_api_key"
          openssl pkey -in "$notary_api_key" -noout
          shopt -s nullglob
          dmgs=(build/jpackage/*.dmg build/distributions/*.dmg build/distributions/*.DMG)
          [ "${#dmgs[@]}" -eq 2 ] || { echo "::error::Expected the jpackage and native DMGs, found ${#dmgs[@]}."; exit 1; }
          for dmg in "${dmgs[@]}"; do
            xcrun notarytool submit "$dmg" --key "$notary_api_key" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

#      # ---------- Sign Linux .deb after build (optional) ----------
#      - name: Sign .deb with GPG
#        if: matrix.os == 'ubuntu-latest' && env.GPG_KEY_ID != ''
#        shell: bash
#        run: |
#          set -euo pipefail
#          for DEB in build/jpackage/*.deb; do
#            [ -e "$DEB" ] || continue
#            echo "Signing $DEB"
#            dpkg-sig --sign builder -k "$GPG_KEY_ID" --gpg-options "--batch --yes --pinentry-mode loopback --passphrase $GPG_PASSPHRASE" "$DEB"
#          done

      - name: Collect installer artifacts
        id: collect
        shell: bash
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          # Look for common installer extensions in build/jpackage and build/distributions
          for f in build/jpackage/*.{dmg,pkg,msi,exe,deb,rpm} build/distributions/*.{dmg,DMG}; do
            [ -e "$f" ] || continue
            cp -v "$f" artifacts/
          done
          echo "COUNT=$(ls -1 artifacts | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Upload installer artifacts
        if: steps.collect.outputs.COUNT != '0' && matrix.artifactSuffix != 'windows-arm'
        uses: actions/upload-artifact@v4
        with:
          name: keystoremanager-installers-${{ matrix.artifactSuffix }}
          path: artifacts/*
          if-no-files-found: error

      # Upload Windows ARM app-image zip
      - name: Upload Windows ARM app-image zip
        if: matrix.artifactSuffix == 'windows-arm'
        uses: actions/upload-artifact@v4
        with:
          name: keystoremanager-app-image-${{ matrix.artifactSuffix }}
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release with Installers
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Display downloaded files
        run: |
          ls -R release-artifacts || true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
